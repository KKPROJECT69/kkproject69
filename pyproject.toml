[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacker-genai-plus"
version = "0.1.0"
description = "HACKER GenAI+ — AI Trading Assistant Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["hacker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
